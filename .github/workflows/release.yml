name: release

# A pushed tag vX.Y.Z builds every platform binary and attaches it, with
# SHA256SUMS.txt, to the GitHub release of that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build
        run: |
          mkdir -p dist
          ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.builtAt=$(date -u +%FT%TZ)"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/bnbloc-acp-${os}-${arch}${ext}" .
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "bnbloc-acp $GITHUB_REF_NAME" --generate-notes
